# ============================================================
#  COMPILAR LA APP ANDROID "GEMA" (APK)  (antes Balances Energua: se conserva el appId y el nombre del archivo para no perder instalaciones ni enlaces)
#  Se ejecuta a mano: pestana Actions -> "Compilar app Android" -> Run workflow.
#  Resultado: https://github.com/<tu-usuario>/<repositorio>/releases/download/app-android/GEMA.apk
#  UNICO enlace valido. La app solo acepta los APK compilados por este archivo (marca BE_APK_CANAL=GEMA, version 4).
#  La app Android abre la misma app de siempre y ademas envia el GPS de la jornada
#  con el celular bloqueado (servicio en segundo plano con notificacion fija).
# ============================================================
name: Compilar app Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Revisar el SDK de Android (ya viene instalado en GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then echo "::error::No se encontro el SDK de Android en el servidor de GitHub"; exit 1; fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          java -version
          node --version

      - name: Script de personalizacion
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow || echo "::warning::No se pudo instalar Pillow (se usara el icono por defecto)"
          ls -la "$GITHUB_WORKSPACE"
          cat > personalizar.py <<'PY'
          # Personaliza el proyecto Android generado (se ejecuta en GitHub Actions)
          import os, re, shutil, sys
          try:
              from PIL import Image
          except Exception:
              Image = None   # sin Pillow: se deja el icono por defecto
          fase, raiz = sys.argv[1], sys.argv[2]          # raiz = carpeta del repositorio
          app = os.path.join(raiz, 'app')
          if fase == 'web':
              # Cargador interno del APK = index.html del repositorio, sin service worker y avisando que es la app Android
              ruta = os.path.join(raiz, 'index.html')
              if not os.path.exists(ruta):
                  sys.exit('ERROR: no existe index.html en la raiz del repositorio (debe ser el cargador de la app)')
              s = open(ruta, encoding='utf-8').read()
              s = re.sub(r"if \('serviceWorker' in navigator\)[^\n]*\n", '', s)
              s = s.replace('<link rel="manifest" href="manifest.json">', '')
              n0 = s.count('window.BE_SHELL=true;')
              s = s.replace('window.BE_SHELL=true;', 'window.BE_SHELL=true;window.BE_NATIVO=true;window.BE_SIRENA=true;window.BE_APK_VER=5;window.BE_APK_CANAL="GEMA";')   # BE_SIRENA: trae la alarma; BE_APK_VER: version del APK (la app exige la minima)
              if n0 != 1 or 'serviceWorker' in s:
                  sys.exit('ERROR: el index.html del repositorio no es el cargador esperado')
              os.makedirs(os.path.join(app, 'www'), exist_ok=True)
              open(os.path.join(app, 'www', 'index.html'), 'w', encoding='utf-8').write(s)
              gema = os.path.join(raiz, 'icon-gema.png')
              for f in ('icon-192.png', 'icon-512.png'):
                  if os.path.exists(gema): shutil.copy(gema, os.path.join(app, 'www', f))   # logo GEMA en la pantalla de carga
                  elif os.path.exists(os.path.join(raiz, f)): shutil.copy(os.path.join(raiz, f), os.path.join(app, 'www', f))
              print('cargador listo')
          elif fase == 'android':
              res = os.path.join(app, 'android', 'app', 'src', 'main', 'res')
              # 0) Sonido de ALARMA (sirena fuerte) para el aviso de GPS apagado: res/raw/sirena.wav
              import wave, struct, math
              os.makedirs(os.path.join(res, 'raw'), exist_ok=True)
              fs, dur = 22050, 6.0                       # 6 s de sirena (sube y baja 4 veces), volumen al maximo
              w = wave.open(os.path.join(res, 'raw', 'sirena.wav'), 'w')
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(fs)
              fase_acum, cuadros = 0.0, bytearray()
              for i in range(int(fs * dur)):
                  t = i / fs
                  f = 750 + 650 * (0.5 - 0.5 * math.cos(2 * math.pi * (t % 1.5) / 1.5))   # barrido 750-1400 Hz
                  fase_acum += 2 * math.pi * f / fs
                  v = 1.0 if math.sin(fase_acum) >= 0 else -1.0                           # onda cuadrada: mas sonora
                  cuadros += struct.pack('<h', int(v * 32000))
              w.writeframes(bytes(cuadros)); w.close()
              print('sonido de alarma listo (res/raw/sirena.wav)')
              # 1) Textos de la notificacion de seguimiento
              st = os.path.join(res, 'values', 'strings.xml')
              x = open(st, encoding='utf-8').read()
              x = x.replace('</resources>',
                  '    <string name="capacitor_background_geolocation_notification_channel_name">Seguimiento de jornada</string>\n'
                  '    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_jornada</string>\n</resources>')
              open(st, 'w', encoding='utf-8').write(x)
              # 2) Icono de la notificacion (vector blanco: pin de ubicacion)
              open(os.path.join(res, 'drawable', 'ic_stat_jornada.xml'), 'w', encoding='utf-8').write(
                  '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" '
                  'android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" '
                  'android:pathData="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></vector>')
              # 3) Icono de la app (el mismo de la app instalada)
              src = os.path.join(raiz, 'icon-gema.png')
              if not os.path.exists(src): src = os.path.join(raiz, 'icon-512.png')
              print('Icono de la app tomado de: ' + src)
              if Image is None:
                  print('AVISO: Pillow no disponible, se usa el icono por defecto')
              elif os.path.exists(src):
                  im = Image.open(src).convert('RGBA')
                  shutil.rmtree(os.path.join(res, 'mipmap-anydpi-v26'), ignore_errors=True)
                  for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
                      carpeta = os.path.join(res, 'mipmap-' + d)
                      for nombre in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                          im.resize((px, px), Image.LANCZOS).save(os.path.join(carpeta, nombre))
              # 3b) Complemento nativo EstadoRed (modo avion / datos moviles) y permiso para leer el estado de la red
              PLUGIN_JAVA = r'''
              package __PKG__;

              import android.content.Context;
              import android.net.ConnectivityManager;
              import android.net.Network;
              import android.net.NetworkCapabilities;
              import android.provider.Settings;
              import android.telephony.TelephonyManager;
              import com.getcapacitor.JSObject;
              import com.getcapacitor.Plugin;
              import com.getcapacitor.PluginCall;
              import com.getcapacitor.PluginMethod;
              import com.getcapacitor.annotation.CapacitorPlugin;

              // GEMA: estado de la conexion del celular (modo avion, datos moviles, wifi) para la alarma de la jornada
              @CapacitorPlugin(name = "EstadoRed")
              public class EstadoRedPlugin extends Plugin {
                  @PluginMethod
                  public void getEstado(PluginCall call) {
                      Context ctx = getContext();
                      boolean avion = false, wifi = false, celular = false, internet = false;
                      int datos = -1;
                      try { avion = Settings.Global.getInt(ctx.getContentResolver(), Settings.Global.AIRPLANE_MODE_ON, 0) != 0; } catch (Exception e) { }
                      boolean sim = false;
                      try {
                          // datos moviles del SIM de datos (interruptor del usuario); en celulares de 2 SIM es el mas fiable
                          TelephonyManager tm = (TelephonyManager) ctx.getSystemService(Context.TELEPHONY_SERVICE);
                          if (tm != null) {
                              sim = tm.getSimState() == TelephonyManager.SIM_STATE_READY;
                              if (android.os.Build.VERSION.SDK_INT >= 26) datos = tm.isDataEnabled() ? 1 : 0;
                          }
                      } catch (Exception e) { }
                      if (datos == -1) { try { datos = Settings.Global.getInt(ctx.getContentResolver(), "mobile_data", -1); } catch (Exception e) { } }
                      try {
                          ConnectivityManager cm = (ConnectivityManager) ctx.getSystemService(Context.CONNECTIVITY_SERVICE);
                          Network n = cm != null ? cm.getActiveNetwork() : null;
                          NetworkCapabilities nc = (cm != null && n != null) ? cm.getNetworkCapabilities(n) : null;
                          if (nc != null) {
                              wifi = nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI);
                              celular = nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR);
                              internet = nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
                          }
                      } catch (Exception e) { }
                      JSObject r = new JSObject();
                      r.put("avion", avion);
                      r.put("datos", datos);
                      r.put("wifi", wifi);
                      r.put("celular", celular);
                      r.put("internet", internet);
                      r.put("sim", sim);
                      call.resolve(r);
                  }
              }
              '''
              MAIN_JAVA = r'''
              package __PKG__;

              import android.os.Bundle;
              import com.getcapacitor.BridgeActivity;

              public class MainActivity extends BridgeActivity {
                  @Override
                  public void onCreate(Bundle savedInstanceState) {
                      registerPlugin(EstadoRedPlugin.class);   // GEMA: modo avion / datos apagados
                      super.onCreate(savedInstanceState);
                  }
              }
              '''
              base_java = os.path.join(app, 'android', 'app', 'src', 'main', 'java')
              main_path = None
              for dp, dn, fn in os.walk(base_java):
                  if 'MainActivity.java' in fn: main_path = os.path.join(dp, 'MainActivity.java')
              if not main_path: sys.exit('ERROR: no se encontro MainActivity.java')
              pkg = re.search(r'^package\s+([\w.]+);', open(main_path, encoding='utf-8').read(), re.M).group(1)
              open(main_path, 'w', encoding='utf-8').write(MAIN_JAVA.replace('__PKG__', pkg))
              open(os.path.join(os.path.dirname(main_path), 'EstadoRedPlugin.java'), 'w', encoding='utf-8').write(PLUGIN_JAVA.replace('__PKG__', pkg))
              man = os.path.join(app, 'android', 'app', 'src', 'main', 'AndroidManifest.xml')
              mt = open(man, encoding='utf-8').read()
              if 'ACCESS_NETWORK_STATE' not in mt:
                  mt = mt.replace('<application', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
                  open(man, 'w', encoding='utf-8').write(mt)
              print('complemento EstadoRed listo (' + pkg + ')')
              # 4) Numero de version: SIEMPRE mayor que el anterior (minutos desde 1970).
              #    No depende del numero de ejecucion de GitHub (que se reinicia si se cambia el flujo),
              #    asi Android nunca lo toma como una version mas vieja y deja actualizar encima.
              import time
              run = int(os.environ.get('GITHUB_RUN_NUMBER', '1'))
              code = int(time.time() // 60)
              bg = os.path.join(app, 'android', 'app', 'build.gradle')
              g = open(bg, encoding='utf-8').read()
              g = re.sub(r'versionCode \d+', 'versionCode %d' % code, g)
              g = re.sub(r'versionName "[^"]*"', 'versionName "2.%d"' % run, g)
              open(bg, 'w', encoding='utf-8').write(g)
              print('android listo, versionCode %d, version 2.%d' % (code, run))
          PY

