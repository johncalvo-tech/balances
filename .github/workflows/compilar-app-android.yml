      - name: Crear el proyecto Android
        run: |
          mkdir -p app
          python3 personalizar.py web "$GITHUB_WORKSPACE"
          cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@7.6.9 @capacitor/cli@7.6.9 @capacitor/android@7.6.9 @capacitor-community/background-geolocation@1.2.26 @capacitor/local-notifications@7.0.3
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "co.energua.balances",
            "appName": "GEMA",
            "webDir": "www",
            "android": { "useLegacyBridge": true }
          }
          JSON
          npx cap add android
          python3 ../personalizar.py android "$GITHUB_WORKSPACE"
          npx cap sync android

      - name: Llave de firma (siempre la misma, para poder actualizar la app)
        env:
          LLAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$LLAVE" ]; then
            echo "$LLAVE" | base64 -d > ~/.android/debug.keystore
            echo "Usando la llave guardada en el secreto ANDROID_KEYSTORE"
          else
            echo "::error::No existe el secreto ANDROID_KEYSTORE. Sin la llave de siempre el APK no se podria instalar encima del anterior. Se detiene la compilacion."
            exit 1
          fi

      - name: Compilar el APK
        run: |
          cd app/android
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GEMA.apk"

      - name: Publicar el APK (enlace fijo para descargar desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android GEMA.apk --title "App Android GEMA (version 2.${{ github.run_number }})" --notes "Descarga GEMA.apk desde el celular e instalala encima de la app actual. Compilado el $(date -u +%Y-%m-%d)." --latest
          echo "Enlace de descarga: https://github.com/${{ github.repository }}/releases/download/app-android/GEMA.apk"
