<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1f35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balances">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Balances Energua</title>
<style>
  html,body{margin:0;height:100%;background:#0d1f35;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f0f4f8}
  #cargando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:600 15px system-ui,sans-serif;gap:14px}
  #cargando img{width:84px;height:84px;border-radius:18px}
</style>
</head>
<body>
<div id="cargando"><img src="icon-192.png" alt=""><div>Cargando Balances Energua...</div></div>
<!-- ============================================================
     PEGA AQUI la URL de tu aplicacion (Implementar > Administrar implementaciones > URL de la app web,
     la que termina en /exec)
     ============================================================ -->
<iframe id="app" allow="geolocation; clipboard-read; clipboard-write; camera" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  var URL_APP = 'https://script.google.com/macros/s/AKfycbwvH4fV65N5tv1KesmBTiccArgPdcpbxm3nxmpesGoK2xUvK4rfQd4MmK-yLCURTRP-Sg/exec';
  var f = document.getElementById('app');
  f.onload = function(){ var c = document.getElementById('cargando'); if (c) c.style.display = 'none'; };
  f.src = URL_APP;
  // La app avisa cuando hay una version nueva publicada: se recarga el marco con la ultima version
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.tipo === 'be_reload') {
      var c = document.getElementById('cargando'); if (c) { c.style.display = 'flex'; c.lastElementChild.textContent = 'Actualizando a la nueva version...'; }
      f.src = URL_APP + (URL_APP.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
    }
  });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
